<title>Nemesis Protocol — Thumbnail</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #020408;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
}

.card {
  width: 1200px;
  height: 628px;
  background: #060810;
  position: relative;
  overflow: hidden;
  display: flex;
  transform-origin: center center;
  flex-shrink: 0;
}

/* subtle grid */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* red left rule */
.red-rule {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: #E11D48;
  z-index: 2;
}

/* red corner glow */
.corner-glow {
  position: absolute;
  left: -120px;
  top: -120px;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, rgba(225,29,72,.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}

/* ── LEFT CONTENT ── */
.left {
  position: relative;
  z-index: 2;
  padding: 56px 0 52px 64px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 620px;
  flex-shrink: 0;
}

.eyebrow {
  font-family: ui-monospace, 'Cascadia Code', monospace;
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #E11D48;
  margin-bottom: 24px;
}

.title-block { flex: 1; display: flex; flex-direction: column; justify-content: center; }

.nemesis {
  font-size: 148px;
  font-weight: 800;
  letter-spacing: -5px;
  line-height: 0.88;
  color: #F0F6FC;
  text-transform: uppercase;
}

.protocol {
  font-family: ui-monospace, 'Cascadia Code', monospace;
  font-size: 36px;
  font-weight: 400;
  letter-spacing: 0.38em;
  color: #E11D48;
  margin-top: 14px;
  text-transform: uppercase;
}

/* ── DIVIDER ── */
.divider {
  width: 80px;
  height: 2px;
  background: #E11D48;
  margin: 32px 0;
  flex-shrink: 0;
}

/* ── STATS ROW ── */
.stats {
  display: flex;
  gap: 40px;
  align-items: flex-end;
}

.stat-item {}

.stat-num {
  font-size: 38px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -1px;
  line-height: 1;
  color: #3FB950;
}

.stat-num.white { color: #F0F6FC; }

.stat-label {
  font-family: ui-monospace, 'Cascadia Code', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #4D5562;
  margin-top: 7px;
}

.stat-divider {
  width: 1px;
  height: 48px;
  background: #1E2330;
  align-self: center;
}

/* ── BOTTOM TAG ── */
.bottom-tag {
  font-family: ui-monospace, 'Cascadia Code', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #2D3444;
}

/* ── RIGHT — CHART ── */
.right {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-right: 48px;
}

.chart-wrap {
  width: 460px;
  height: 340px;
  position: relative;
}

.chart-label {
  position: absolute;
  top: 0;
  right: 0;
  font-family: ui-monospace, 'Cascadia Code', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #2D3444;
}

/* right-side bottom branding */
.brand-tag {
  position: absolute;
  bottom: 36px;
  right: 52px;
  font-family: ui-monospace, 'Cascadia Code', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: #2D3444;
  text-transform: uppercase;
  z-index: 2;
}
</style>

<div class="card" id="card">
  <div class="red-rule"></div>
  <div class="corner-glow"></div>

  <!-- LEFT -->
  <div class="left">
    <div class="eyebrow">// Automated Futures Trading Bot</div>

    <div>

        <div class="stat-item">
          <div class="stat-num white">7.38×</div>

          <div class="stat-num white">$545</div>
          <div class="stat-label">Max Drawdown</div>
        </div>

  <!-- RIGHT — equity curve -->
  <div class="right">

      <svg viewBox="0 0 460 320" width="460" height="320" style="margin-top:20px">
        <defs>

          <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">

          C 308 70,  312 56,  328 46
          C 340 38,  346 52,  360 42

          fill="url(#fillGrad)"/>

        <!-- equity curve line -->

          M 0 280
          C 8 274, 14 268, 22 265
          C 32 261, 38 270, 50 260
          C 62 250, 66 238, 78 232
          C 88 226, 94 240, 106 228
          C 118 216, 122 200, 136 190
          C 148 181, 152 196, 166 182
          C 178 170, 184 152, 198 140
          C 210 130, 214 148, 228 132
          C 242 118, 246 98,  262 86
          C 274 76,  278 92,  294 80
          C 308 70,  312 56,  328 46
          C 340 38,  346 52,  360 42
          C 374 32,  380 20,  396 14
          C 410 8,   420 18,  436 12
          L 460 8"
          fill="none"
          stroke="#3FB950"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

        <!-- endpoint dot -->
        <circle cx="460" cy="8" r="5" fill="#3FB950"/>
        <circle cx="460" cy="8" r="10" fill="#3FB950" fill-opacity="0.2"/>

        <!-- P&L label at end -->
        <text x="446" y="5" text-anchor="end"
              font-family="ui-monospace, monospace"
              font-size="11" fill="#3FB950" letter-spacing="0.5">+$18,986</text>
      </svg>
    </div>
  </div>

  <div class="brand-tag">nemesis-protocol.mnq</div>
</div>

<script>
(function () {
  function scale() {
    const card = document.getElementById('card');
    const pw = window.innerWidth;
    const ph = window.innerHeight;
    const s  = Math.min(pw / 1200, ph / 628) * 0.96;
    card.style.transform = `scale(${s})`;
  }
  scale();
  window.addEventListener('resize', scale);
})();
</script>
